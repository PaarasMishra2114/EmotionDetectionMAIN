services:
  - type: web
    name: emotion-detection-main
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 server:app
    healthCheckPath: /
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TF_NUM_INTRAOP_THREADS
        value: '1'
      - key: TF_NUM_INTEROP_THREADS
        value: '1'
      - key: TF_ENABLE_ONEDNN_OPTS
        value: '0'